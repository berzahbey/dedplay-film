services:
  dedplay-film:
    build: .
    image: berzahbey/dedplay-film:latest
    container_name: dedplay-film
    ports:
      - "8090:8000"
    environment:
      - TZ=Europe/Amsterdam
      # Tüm Media klasörü TEK bağlama noktası: taşımalar (çöp kutusu, düzenleme) anında olur
      - MEDIA_DIRS=/archive/Photos,/archive/video,/archive/Resimler,/archive/Videolar,/archive/Ekran ve Kaydedilenler,/archive/Gelen
      - TRASH_DIR=/archive/Dedplay Çöp Kutusu
      # Eski sürümün kayıtlı yolları (yeniden tarama gerekmesin)
      - PATH_MIGRATE=/media/photos=/archive/Photos,/media/videos=/archive/video
      # Film (deneysel) bölümü için
      - MUSIC_DIR=/archive/Music/music
      - MUSIC_DEFAULT=muzaffer muzik
      - OUTPUT_DIR=/archive/Movies/Dedplay Film
    volumes:
      # Yazma izinli: kopyalar çöp kutusuna taşınır, kalanlar Resimler/Videolar'a yerleşir.
      # Kalıcı silme sadece arayüzdeki "kalıcı sil" ile olur.
      - /DATA/Media:/archive
      # Veritabanı, küçük resimler, ayarlar
      - /DATA/AppData/dedplay-film:/app/data
    restart: unless-stopped
