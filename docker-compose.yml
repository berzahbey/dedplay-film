# ZimaOS'a kurmak için bu dosyayı DEĞİL, zimaos.yaml'ı kullan. Bu dosya terminalden kaynak koddan derlemek içindir.
name: dedplay-arsiv
services:
  dedplay-arsiv:
    build: .
    image: ghcr.io/berzahbey/dedplay-film:latest
    container_name: dedplay-arsiv
    ports:
      - "8090:8000"
    environment:
      - TZ=Europe/Amsterdam
      # Tüm Media klasörü TEK bağlama noktası: taşımalar (çöp kutusu, düzenleme) anında olur
      - MEDIA_DIRS=/archive/Photos,/archive/video,/archive/Arsiv,/archive/Arşiv,/archive/Resimler,/archive/Videolar,/archive/Ekran ve Kaydedilenler,/archive/Gelen
      - TRASH_DIR=/archive/Arsiv/Dedplay Cop Kutusu
      # Eski sürümün kayıtlı yolları (yeniden tarama gerekmesin)
      - PATH_MIGRATE=/media/photos=/archive/Photos,/media/videos=/archive/video
      # Film (deneysel) bölümü için
      - MUSIC_DIR=/archive/Music/music
      - MUSIC_DEFAULT=muzaffer muzik
      - OUTPUT_DIR=/archive/Movies/Dedplay Film
    volumes:
      # Yazma izinli: kopyalar çöp kutusuna taşınır, kalanlar Photos/video klasörlerine yerleşir.
      # Kalıcı silme sadece arayüzdeki "kalıcı sil" ile olur.
      - /DATA/Media:/archive
      # ZimaOS client yedekleri: telefon klasörleri kendiliğinden bulunur (Ayarlar → Telefon yedekleri)
      - /DATA/Backup:/backup
      # Veritabanı, küçük resimler, ayarlar
      - /DATA/AppData/dedplay-film:/app/data
    restart: unless-stopped
